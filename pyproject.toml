[project]
name = "takvim"
version = "0.1.0"
description = "Sade, terminal tabanlı takvim"
requires-python = ">=3.10"
dependencies = ["rich>=13", "httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
takvim = "takvim.cli:main"
takvim-server = "takvim.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["takvim"]
